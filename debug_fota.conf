# Diagnostic-only overlay: adds bare RTT printk on top of prj_3v3.conf
# WITHOUT touching MCUMGR/MCUboot (unlike debugging.conf, which intentionally
# disables FOTA). Used to capture logs while reproducing the "SMP service
# unsupported" issue on a build that still has BLE DFU enabled.
# Deliberately skips CONFIG_LOG (too much RAM with MCUMGR already enabled -
# full logging overflowed RAM by 1130 bytes). Plain printk over RTT only.
# Not meant to be a permanent build variant - delete once the bug is found.

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SERIAL=n
