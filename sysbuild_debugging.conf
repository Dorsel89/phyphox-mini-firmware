# Full sysbuild configuration for the "debugging" build variant (used via
# -DSB_CONF_FILE, replacing sysbuild.conf entirely -- SB_EXTRA_CONF_FILE
# does not reliably override values already set in the base file).
#
# Partition Manager stays on (needed for the datalog flash partition), but
# no MCUboot bootloader image is built: this variant is flashed directly
# via SWD/RTT for local debugging, not via DFU.
SB_CONFIG_PARTITION_MANAGER=y
SB_CONFIG_BOOTLOADER_MCUBOOT=n
SB_CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
