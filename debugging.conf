
#reduce footprint
CONFIG_BOOT_BANNER=y
CONFIG_SIZE_OPTIMIZATIONS=y

#debugging

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2948

CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_LOG_PRINTK=y
#CONFIG_LOG_DEFAULT_LEVEL=3
#CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y


#CONFIG_POWEROFF=y
CONFIG_HW_STACK_PROTECTION=y

###
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n
CONFIG_IMG_MANAGER=n

CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n
#FOTANEW

# Ensure an MCUboot-compatible binary is generated.
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=n