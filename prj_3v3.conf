CONFIG_NEWLIB_LIBC=y #needed for bmp581 library
CONFIG_MULTITHREADING=y

#CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=y

CONFIG_PINCTRL=y

CONFIG_SENSOR=y

#CONFIG_HAS_STLIB=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_SPI_NOR_SFDP_RUNTIME=y

CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y

#BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_BT_DEVICE_NAME="phyfob"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=40
CONFIG_BT_CTLR_TX_PWR_PLUS_4=n

#reduce footprint
CONFIG_BT_CTLR_PRIVACY=n
# Both banners have to go. The Zephyr one already depends on !NCS_BOOT_BANNER
# and was therefore never in the build, while the NCS one is default y and
# pulls in PRINTK and EARLY_CONSOLE - which quietly overrode CONFIG_PRINTK=n
# below. The result was that every printk() in this project still ran its full
# formatting in the release build, including the %f conversions in the BMP
# hot path, only to drop the output for lack of a console backend.
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_SIZE_OPTIMIZATIONS=y

CONFIG_SPI_NRFX=y
CONFIG_SPI_NOR=y
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_SPI_NOR_SFDP_DEVICETREE=n
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
###################

CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_NANO=n

# Kept at 1024: 2048 was tried while chasing a crash during BMP streaming and
# made no measurable difference, because the crash turned out to be a null work
# handler, not a stack overflow. The spare SRAM is not idle either - with
# newlib it is the malloc heap, which grows into whatever the static
# allocations leave over.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048

# GATT write callbacks (incl. datalog_configure()/datalog_dump(), which now
# synchronously call into the SPI flash driver and bt_gatt_notify_uuid())
# run on the BT RX thread. The Zephyr default (1024 here) is too tight for
# that call chain, especially in debug builds with -Og.
CONFIG_BT_RX_STACK_SIZE=2048

#CONFIG_POWEROFF=y
CONFIG_HW_STACK_PROTECTION=y

# Without this Zephyr halts on a fatal error and the fob stays dead until the
# battery is pulled - it stops advertising, so it cannot even be updated over
# the air. Rebooting is the far better failure mode for a device in the field.
CONFIG_RESET_ON_FATAL_ERROR=y
#low power

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_PRINTK=n
CONFIG_SERIAL=n


###
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
#CONFIG_FLASH_SPI_NOR=y
CONFIG_BOARD_ENABLE_DCDC=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=n


#FOTA#############
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=n
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Enable most core commands.
CONFIG_STREAM_FLASH=y

CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
#FOTANEW

# Standard BLE Device Information Service (0x180A), so any generic BLE
# client (not just mcumgr-aware tooling) can read the firmware version via
# the standard Firmware Revision String characteristic (0x2A26). Populated
# automatically from the same VERSION file that signs the MCUboot image.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_MANUF_NAME_STR="phyphox:tools"
CONFIG_BT_DIS_MODEL_NUMBER_STR="mini"
# PnP ID would just be a meaningless 0/0/0 placeholder without a real
# registered Vendor ID (Bluetooth SIG or USB-IF) - not worth the clutter.
CONFIG_BT_DIS_PNP=n

# Ensure an MCUboot-compatible binary is generated.
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_FLASH_MAP=y

# CRC over the datalog settings record kept in the last sector of the
# datalog partition, so a half-written one is not restored as garbage.
CONFIG_CRC=y

# Allow for large Bluetooth data packets.
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_BT_L2CAP_TX_BUF_COUNT=10

CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

CONFIG_BT_BUF_ACL_RX_SIZE=251

CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10

CONFIG_BT_CTLR_RX_BUFFERS=2

CONFIG_BT_CONN_TX_MAX=10

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_BT_ATT_PREPARE_COUNT=2

# Enable the Bluetooth (unauthenticated) and shell mcumgr transports.
CONFIG_BT=y

#CONFIG_ISR_STACK_SIZE=1024
CONFIG_MPSL_WORK_STACK_SIZE=1024

CONFIG_BT_LL_SW_SPLIT=n

#CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_ADC=n
CONFIG_ADC_NRFX_SAADC=n
CONFIG_NRFX_SAADC=n
CONFIG_BT_BAS=n